<!doctype html>
<!-- MANUAL PREVIEW HARNESS (serve repo root: python3 -m http.server 4310, open /tests/manual/study-preview.html). Uses the REAL controller/modules with a MOCKED
     Supabase network layer (window.fetch stub). This is NOT live Supabase verification. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Analytics 2.0 preview (mocked backend)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../public/styles.css">
<link rel="stylesheet" href="../../public/study-analytics-upgrade.css">
<style>
  body { padding: 16px; }
  .harness-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .harness-bar button, .harness-bar select { padding:6px 10px; }
</style>
</head>
<body>
<div class="harness-bar">
  <button id="h-theme">Toggle dark</button>
  <select id="h-scn">
    <option value="goal">complete → daily goal reached</option>
    <option value="streak7">complete → 7-day badge</option>
    <option value="first">complete → first task</option>
    <option value="regular">complete → regular</option>
    <option value="fail">complete → summary read fails</option>
  </select>
  <button id="h-complete">Mark a task complete (simulated)</button>
  <button id="h-empty">Load empty student</button>
  <button id="h-full">Load active student</button>
</div>

<div id="view-analytics">
  <section class="hero" style="margin-bottom:24px;"><div class="hero-copy"><h2>Study Task Analytics</h2><p class="muted">existing header (placeholder)</p></div></section>
  <section id="study-streak-section"></section>
  <div class="analytics-section">
    <article class="analytics-card"><div class="analytics-card-title"><h3>Weekly Activity (Last 7 Days)</h3></div><p class="muted">existing (placeholder)</p></article>
    <article class="analytics-card"><div class="analytics-card-title"><h3>Workload Breakdown</h3></div><p class="muted">existing (placeholder)</p></article>
  </div>
  <div id="study-calendar-section"></div>
  <section class="plan-board"><h2>Subject-Wise Completion Progress</h2><p class="muted">existing (placeholder)</p></section>
  <div id="study-badges-section"></div>
  <section class="plan-board" style="margin-top:24px;"><h2>Quiz Performance</h2><p class="muted">existing (placeholder)</p></section>
</div>
<div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>

<script type="module">
  const iso = (d) => d.toISOString().slice(0, 10);
  const todayD = new Date();
  const dayOffset = (n) => { const d = new Date(todayD); d.setUTCDate(d.getUTCDate() - n); return iso(d); };
  const badge = (k, ago = 5) => ({ badge_key: k, earned_at: new Date(Date.now() - ago * 86400000).toISOString() });

  const activeStudent = () => ({
    today: iso(todayD), timezone: 'Asia/Seoul', daily_goal: 3,
    current_streak: 5, longest_streak: 9, protection_balance: 1, toward_next_protection: 5,
    total_active_days: 12, protected_days_used: 1, total_completed_tasks: 20, completed_today: 2,
    studied_today: true, streak_status: 'active_today', tracking_started: dayOffset(20),
    days: [
      { date: dayOffset(0), tasks: 2, kind: 'active' },
      { date: dayOffset(1), tasks: 1, kind: 'active' },
      { date: dayOffset(2), tasks: 0, kind: 'protected' },
      { date: dayOffset(3), tasks: 3, kind: 'active' },
      { date: dayOffset(4), tasks: 1, kind: 'active' },
      { date: dayOffset(5), tasks: 1, kind: 'active' },
      { date: dayOffset(9), tasks: 2, kind: 'active' },
    ],
    achievements: [badge('first_step', 19), badge('consistent_learner', 10), badge('task_achiever', 3)],
  });
  const emptyStudent = () => ({
    today: iso(todayD), timezone: 'Asia/Seoul', daily_goal: 3, current_streak: 0, longest_streak: 0,
    protection_balance: 0, toward_next_protection: 0, total_active_days: 0, protected_days_used: 0,
    total_completed_tasks: 0, completed_today: 0, studied_today: false, streak_status: 'none',
    tracking_started: null, days: [], achievements: [],
  });

  window.__summary = activeStudent();
  window.__failSummary = false;
  window.__log = [];

  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const url = typeof input === 'string' ? input : input.url;
    if (url.includes('/rest/v1/rpc/')) {
      const name = url.split('/rpc/')[1].split('?')[0];
      const body = init && init.body ? JSON.parse(init.body) : {};
      window.__log.push({ name, body });
      if (name === 'get_study_summary') {
        if (window.__failSummary) return new Response(JSON.stringify({ message: 'boom' }), { status: 500, headers: { 'content-type': 'application/json' } });
        return new Response(JSON.stringify(window.__summary), { status: 200, headers: { 'content-type': 'application/json' } });
      }
      if (name === 'set_daily_study_goal') {
        if (body.p_goal < 1 || body.p_goal > 20) return new Response(JSON.stringify({ message: 'Daily goal must be between 1 and 20 tasks' }), { status: 400, headers: { 'content-type': 'application/json' } });
        window.__summary.daily_goal = body.p_goal;
        return new Response(null, { status: 204 });
      }
      return new Response(null, { status: 204 });
    }
    return realFetch(input, init);
  };

  const mod = await import("../../public/src/study-analytics-upgrade.js");
  const tasks = [{ id: 't1', deadline: new Date().toISOString(), completed: true }];
  mod.initStudyAnalytics({
    toast: (m) => { const el = document.createElement('div'); el.className = 'toast'; el.textContent = m; document.getElementById('toast-stack').appendChild(el); setTimeout(() => el.remove(), 2600); },
    getTasks: () => tasks,
    getStudentId: () => '11111111-1111-4111-8111-111111111111',
  });
  await mod.loadStudyAnalytics();
  window.__mod = mod;

  document.getElementById('h-theme').onclick = () => document.documentElement.classList.toggle('dark');
  document.getElementById('h-empty').onclick = async () => { window.__summary = emptyStudent(); await mod.loadStudyAnalytics(); };
  document.getElementById('h-full').onclick = async () => { window.__summary = activeStudent(); await mod.loadStudyAnalytics(); };
  document.getElementById('h-complete').onclick = async () => {
    const scn = document.getElementById('h-scn').value;
    const s = JSON.parse(JSON.stringify(window.__summary));
    window.__failSummary = false;
    if (scn === 'goal') { s.completed_today = s.daily_goal; }
    if (scn === 'streak7') { s.achievements.push(badge('weekly_champion', 0)); s.current_streak = 7; s.longest_streak = 9; s.completed_today += 1; }
    if (scn === 'first') { s.achievements = [badge('first_step', 0)]; s.total_completed_tasks = 1; s.completed_today = 1; }
    if (scn === 'regular') { s.completed_today = Math.max(0, s.completed_today); s.total_completed_tasks += 1; }
    if (scn === 'fail') { window.__failSummary = true; }
    window.__summary = s;
    await mod.handleTaskCompleted({ id: 't1' });
  };
</script>
</body>
</html>
